name: Build Multi-Platform Apps (APK, iOS, macOS, Windows, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor & Generate Android Project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PustakaCari-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PustakaCari-android-apk
          path: mobile/PustakaCari-android.apk

  build-ios:
    name: iOS App (Unsigned .xcarchive / .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor & Generate iOS Project
        working-directory: mobile
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned iOS App & Package IPA
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r ../../PustakaCari-ios-unsigned.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PustakaCari-ios-app
          path: mobile/PustakaCari-ios-unsigned.ipa

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy icon & install Electron Builder
        working-directory: desktop
        run: |
          Copy-Item ..\public\icons\icon-512.png .\icon.png -Force
          npm install
          npx electron-builder --win --publish never

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: PustakaCari-windows
          path: |
            desktop/dist/*.exe

  build-macos:
    name: macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy icon & build macOS app
        working-directory: desktop
        run: |
          cp ../public/icons/icon-512.png ./icon.png
          npm install
          npx electron-builder --mac --publish never

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: PustakaCari-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  build-linux:
    name: Linux (.AppImage & .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy icon & build Linux packages
        working-directory: desktop
        run: |
          cp ../public/icons/icon-512.png ./icon.png
          npm install
          npx electron-builder --linux --publish never

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: PustakaCari-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
