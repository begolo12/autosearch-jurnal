<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SmartSari</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0E0F12;
      color: #F4F4F5;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 340px;
      background: #151619;
      border: 1px solid #2C2E35;
      border-radius: 16px;
      padding: 24px;
    }
    .badge {
      display: inline-block;
      background: #DB2777;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: #A1A1AA;
      line-height: 1.5;
      margin: 0 0 18px;
    }
    button {
      background: #DB2777;
      color: #FFFFFF;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">SmartSari</div>
    <h1>Memuat SmartSari...</h1>
    <p>Pastikan perangkat terhubung ke internet untuk mencari, membaca, dan menerjemahkan jurnal ilmiah.</p>
    <button type="button" onclick="location.reload()">Muat Ulang</button>
  </main>
</body>
</html>
